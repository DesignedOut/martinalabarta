  <style>
    :root {
      --ink: #1a1820;
      --mid: #4a4760;
      --light: #8a87a0;
      --rule: #d0cedc;
      --accent: #4A1FA6;
      --olive: #E8622A;
      --accent-dark: #3a1880;
      --fp-head: 'EB Garamond', serif;
      --fp-body: 'Jost', sans-serif;
      --page-w: 210mm;
      --page-pad: 18mm;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f4f4f8;
      font-family: var(--fp-body);
      font-weight: 300;
      color: var(--ink);
      font-size: 12pt;
      line-height: 1.55;
    }

    .page-wrap {
      max-width: var(--page-w);
      margin: 2rem auto;
      background: #fff;
      box-shadow: 0 4px 32px color-mix(in srgb,var(--accent) 10%,transparent);
      padding: var(--page-pad);
    }

    .print-bar {
      max-width: var(--page-w);
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .back-link {
      font-family: var(--fp-body);
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mid);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent); }
    .print-btn {
      font-family: var(--fp-body);
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.5rem 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-radius: 2px;
      transition: background 0.2s;
    }
    .print-btn:hover { background: var(--accent-dark); }
    .print-btn svg { width: 13px; height: 13px; stroke: #fff; stroke-width: 2; fill: none; }

    header {
      border-bottom: 2px solid var(--ink);
      padding-bottom: 0.9rem;
      margin-bottom: 1.4rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      align-items: end;
    }
    .hd-name {
      font-family: var(--fp-head);
      font-size: 18pt;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--ink);
      white-space: nowrap;
    }
    .hd-name .martina {
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
      font-style: normal;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--olive);
      font-size: 15pt;
    }
    .hd-role {
      font-size: 9pt;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mid);
      margin-top: 0.35rem;
      white-space: nowrap;
    }
    .hd-contact {
      text-align: right;
      font-size: 10pt;
      color: var(--mid);
      line-height: 1.7;
    }
    .hd-contact a { color: var(--accent); text-decoration: none; }

    .sec { margin-bottom: 1.3rem; }
    .sec-title {
      font-size: 9pt;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      border-bottom: 0.5pt solid var(--rule);
      padding-bottom: 0.25rem;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .sec-title.olive { color: var(--olive); }
    .sec-num { font-size: 8pt; opacity: 0.55; font-weight: 400; }

    .two-col { display: block; }
    .two-col > div { display: block; width: auto; }

    .entry {
      display: grid;
      grid-template-columns: 34mm 1fr;
      gap: 0.5rem 0.75rem;
      padding: 0.45rem 0;
      border-bottom: 0.5pt solid var(--rule);
    }
    .entry:last-child { border-bottom: none; }
    .e-date { font-size: 9.5pt; color: var(--light); padding-top: 0.1rem; line-height: 1.4; white-space: nowrap; }
    .e-title { font-weight: 500; font-size: 11pt; line-height: 1.35; margin-bottom: 0.1rem; }
    .e-sub { font-size: 10pt; color: var(--mid); line-height: 1.4; }
    .e-body { font-size: 10pt; color: var(--mid); line-height: 1.5; margin-top: 0.2rem; }
    .e-italic { font-style: italic; }
    /* PhD research abstract, full width: a touch smaller than the entry text (10pt), because full-width lines look bigger */
    .abs-l { font-size: 9pt; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mid); margin-bottom: 0.4rem; }
    .abs { font-size: 9.5pt; color: var(--mid); line-height: 1.5; margin-bottom: 0.75rem; }

    /* hierarchy: purple = section (.sec-title), orange = sub-section (.tsub / .grp), grey = year */
    .tsub, .grp { font-size: 9.5pt; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--olive); margin: 1rem 0 0.35rem; }
    .sec-title + .tsub, .sec-title + .avoid-break > .tsub:first-child, .sec-title + .ygrp .tsub, .sec-title + * > .avoid-break > .tsub:first-child,
    .sec > div:nth-child(2) > .tsub:first-child, .sec > div:nth-child(2) > .avoid-break > .tsub:first-child, .sec > div:nth-child(2) > .ygrp:first-child .tsub { margin-top: 0.25rem; }
    .ssec { margin-bottom: 0.2rem; }
    .sw-grp { font-size: 8pt; letter-spacing: 0.1em; text-transform: uppercase; color: var(--light); margin: 0.45rem 0 0.2rem; }
    .sw-grp:first-child { margin-top: 0.1rem; }
    /* one-off items (publications, guest lectures, workshops, theses) grouped by year: tracked year + hairline */
    .ybody { padding: 0.1rem 0 0 0; }
    .ybody.ycont { padding-top: 0; }
    .ylab { display: flex; align-items: center; gap: 0.6rem; font-family: 'Sometype Mono', var(--fp-body), monospace; font-size: 9.5pt; letter-spacing: 0.22em; font-weight: 500; color: var(--mid); margin: 0.35rem 0 0.1rem; }
    .ylab::after { content: ''; flex: 1; height: 0.5pt; background: var(--rule); }
    .ybody > .pub-entry { padding-left: 6mm; }
    .pub-entry { padding: 0.3rem 0 0.35rem; }
    .tl-when { font-size: 9pt; color: var(--light); letter-spacing: 0.04em; margin-bottom: 0.05rem; }
    .pub-title-print { font-family: var(--fp-head); font-size: 12pt; font-style: italic; line-height: 1.35; color: var(--ink); }
    .pub-authors-print { font-size: 10pt; color: var(--mid); margin-top: 0.1rem; }
    .pub-authors-print .me { color: var(--ink); font-weight: 500; }
    .pub-ref { font-size: 9.5pt; color: var(--light); margin-top: 0.15rem; line-height: 1.4; }
    .pub-links-print { margin-top: 0.2rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .pub-link-print { font-size: 9pt; color: var(--accent); text-decoration: none; letter-spacing: 0.04em; }
    .pub-link-print:hover { text-decoration: underline; }
    .pub-badge-print {
      font-size: 8pt; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--accent); border: 0.5pt solid var(--accent);
      padding: 0.05rem 0.35rem; border-radius: 1px;
      display: inline-block; margin-left: 22mm; margin-top: 0.2rem; margin-bottom: 0.1rem;
    }
    .pub-badge-print.olive { color: var(--olive); border-color: var(--olive); }
    .pub-badge-print.mid { color: var(--mid); border-color: var(--light); }

    .skill-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.3rem; }
    .skill-lbl { font-size: 10pt; color: var(--mid); width: 38mm; flex-shrink: 0; }
    .skill-track { flex: 1; height: 2pt; background: var(--rule); }
    .skill-fill { height: 100%; background: var(--accent); }

    .lang-row { display: flex; align-items: center; justify-content: space-between; padding: 0.3rem 0; border-bottom: 0.5pt solid var(--rule); font-size: 10.5pt; }
    .lang-row:last-child { border-bottom: none; }
    .lang-lv { font-size: 9.5pt; color: var(--light); }
    .lang-dots { display: flex; gap: 2px; }
    .ldot { width: 5px; height: 5px; border-radius: 50%; border: 0.75pt solid var(--ink); }
    .ldot.f { background: var(--ink); }

    .tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .tag-print { font-size: 9pt; letter-spacing: 0.08em; text-transform: uppercase; border: 0.5pt solid var(--rule); color: var(--mid); padding: 0.15rem 0.45rem; border-radius: 1px; }

    .role-card { border-left: 1.5pt solid var(--accent); padding: 0.35rem 0.6rem; margin-bottom: 0.5rem; page-break-inside: avoid; break-inside: avoid; }
    .role-card.olive { border-color: var(--olive); }
    .role-card.mid { border-color: var(--rule); }
    .rc-date { font-size: 9pt; color: var(--light); margin-bottom: 0.1rem; }
    .rc-title { font-weight: 500; font-size: 10.5pt; margin-bottom: 0.15rem; }
    .rc-body { font-size: 9.5pt; color: var(--mid); line-height: 1.5; }

    /* index as a 3-column grid: every item starts on its own column line, nothing is pushed right by a separator when the line wraps */
    .p-toc { margin-top: 0.6rem; font-size: 9pt; letter-spacing: 0.08em; text-transform: uppercase; color: var(--light); line-height: 1.9; display: grid; grid-template-columns: repeat(3, max-content); column-gap: 2.2rem; justify-content: start; }
    .p-toc a { color: var(--accent); text-decoration: none; white-space: nowrap; }
    .p-toc a span { opacity: 0.55; margin-right: 0.2rem; }
    .p-toc .dot { margin: 0 0.35rem; color: var(--rule); }
    /* two-column rows as a table: Safari drops grid blocks from the PDF near page breaks */
    /* two-column rows with floats: the most reliable layout in Safari's PDF output
       (grid and table rows near the end of the page made Safari drop content, e.g. the QR or the closing line) */
    .p-row { display: flow-root; width: 100%; }
